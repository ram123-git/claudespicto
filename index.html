<style>
:root{--bg:#eef0f8;--ink:#151a38;--muted:#586083;--line:#d5daee;--panel:#ffffff;--accent:#3b5bff;--accent-ink:#ffffff;color-scheme:light;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1226;--ink:#eef0ff;--muted:#a3abd2;--line:#2c3266;--panel:#181c3a;--accent:#8aa0ff;--accent-ink:#0b1030;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;max-width:420px;margin:0 auto;padding-block:24px}
img{width:128px;height:128px;border-radius:29px;box-shadow:0 10px 28px rgba(21,26,56,.25)}
h1{margin:0;font:800 clamp(30px,8vw,40px)/1.1 "Trebuchet MS",system-ui,sans-serif;letter-spacing:-.015em}
p{margin:0;color:var(--muted)}
.btns{display:flex;flex-direction:column;gap:12px;width:100%}
button{font:inherit;font-weight:700;font-size:20px;min-height:58px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;width:100%}
button.alt{background:var(--panel);color:var(--ink);border:2px solid var(--line)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style></head>

--line:#2c3266;\n  --accent:#8aa0ff; --accent-ink:#0b1030; --good:#4cd38e; --bad:#ff7f8d;\n  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;\n}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 32px}\nh1,h2,h3{font-family:var(--font-display);letter-spacing:-.015em;margin:0;text-wrap:balance;line-height:1.1}\nh1{font-size:clamp(34px,7vw,60px);font-weight:800}\nh2{font-size:clamp(24px,4vw,32px);font-weight:800}\nh3{font-size:18px;font-weight:800;margin-bottom:10px}\np{margin:0}\n.muted{color:var(--muted)}\n.wrap{max-width:1180px;margin:0 auto}\n.narrow{max-width:520px}\n.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}\n.lead{font-size:18px;margin-top:10px}\n.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:6px 14px;max-width:1180px;margin:0 auto}\n.brand{display:flex;align-items:center;gap:8px;font:800 clamp(22px,4vw,28px)/1 var(--font-display);letter-spacing:-.02em}\n.brand svg{width:34px;height:34px;flex:none}\n.sq{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}\n.top-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}\n.pill{font-size:13px;font-weight:700;padding:6px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);display:inline-flex;gap:7px;align-items:center}\n.pill.ok::before,.pill.bad::before{content:\"\";width:8px;height:8px;border-radius:50%;background:var(--good)}\n.pill.bad::before{background:var(--bad)}\nbutton{font:inherit;color:inherit;cursor:pointer}\n.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink);min-height:48px}\n.btn:active{transform:translateY(1px)}\n.btn.alt{background:var(--panel);color:var(--ink);border:2px solid var(--line)}\n.btn.hi{background:var(--hi);color:var(--hi-ink)}\n.btn.bad{background:var(--panel);color:var(--bad);border:2px solid var(--line)}\n.btn.sm{padding:7px 12px;font-size:14px;min-height:38px;border-radius:10px}\n.btn.big{font-size:20px;padding:17px 26px;width:100%}\n.btn[disabled]{opacity:.45;cursor:not-allowed}\n:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\ninput,select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:11px 14px;min-height:48px;width:100%}\n.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}\n.stack{display:flex;flex-direction:column;gap:14px}\n.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}\n.row>*{min-width:0}\n.grow{flex:1 1 140px}\n.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}\n.play-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}\n@media (max-width:860px){.grid2,.play-grid{grid-template-columns:minmax(0,1fr)}}\n.hero{padding-block:10px 22px;display:flex;flex-direction:column;gap:14px;max-width:760px}\n.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}\n.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}\n.names{display:flex;flex-wrap:wrap;gap:8px}\n.name{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:2px solid var(--line);background:var(--panel);font-weight:700;font-size:17px;max-width:100%}\n.name .dot{width:14px;height:14px;border-radius:50%;flex:none}\n.name small{font-weight:600;font-size:12px;color:var(--muted)}\n.name.off{opacity:.65}\nbutton.name:hover{border-color:var(--accent)}\n.name.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}\n.name .x{border:0;background:none;font-size:20px;line-height:1;padding:0 0 0 2px;color:var(--muted)}\n.code{font:800 clamp(46px,9vw,78px)/1 var(--font-display);letter-spacing:.14em;margin-block:6px}\n.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:12px;overflow:hidden}\n.seg button{border:0;background:var(--panel);padding:9px 14px;font-weight:700;min-height:42px}\n.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}\n.field{display:flex;flex-direction:column;gap:6px}\n.field>span{font-size:13px;font-weight:700;color:var(--muted)}\n.stage{position:relative;width:100%;aspect-ratio:10/7;background:var(--paper);border-radius:18px;border:2px solid var(--line);overflow:hidden;touch-action:none}\n.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}\n.cover{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:22px;background:rgba(251,251,248,.94);color:var(--paper-ink)}\n.cover .eyebrow{color:#5c6075}\n.huge{font-size:clamp(28px,5vw,46px)}\n.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}\n.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line);padding:0;font-size:11px;font-weight:800}\n.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--accent)}\n.sw.eraser{background:var(--paper);color:var(--paper-ink)}\n.wd{width:40px;height:40px;border-radius:50%;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;padding:0}\n.wd i{display:block;border-radius:50%;background:var(--ink)}\n.wd[aria-pressed=true]{border-color:var(--accent)}\n.timer{font:800 56px/1 var(--font-display);font-variant-numeric:tabular-nums;margin-top:6px}\n.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}\n.bar>i{display:block;height:100%;width:100%;background:var(--hi);transition:width .25s linear}\n.bar.low>i{background:var(--bad)}\n.bigword{font:800 clamp(30px,5vw,44px)/1.05 var(--font-display);overflow-wrap:anywhere}\n.secret{font:800 26px/1.1 var(--font-display);padding:12px 14px;border-radius:12px;border:2px dashed var(--line);color:var(--muted);overflow-wrap:anywhere}\n.secret.on{color:var(--ink);border-style:solid;border-color:var(--accent)}\n.peek{display:flex;flex-direction:column;gap:8px}\n.banner{padding:12px 14px;border-radius:12px;background:var(--hi);color:var(--hi-ink);font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:10px}\n.confirm{display:flex;flex-direction:column;gap:8px;margin-top:12px}\n.rank{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:8px}\n.rank li{padding-left:4px}\n.rank li>div{display:flex;align-items:center;gap:8px}\n.rank .nm{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}\n.rank .pts{font-variant-numeric:tabular-nums}\n.rank .dot{width:12px;height:12px;border-radius:50%;flex:none}\n.phase{display:block}\n.note{font-size:14px;color:var(--muted)}\n@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\n\u003cheader class=\"top\">\n  \u003cdiv class=\"brand\">\n    \u003csvg viewBox=\"0 0 40 40\" aria-hidden=\"true\">\u003cpath class=\"sq\" d=\"M5 30 C 10 8, 14 38, 20 18 S 30 6, 35 24\"/>\u003c/svg>\n    \u003cspan>Krabbelrace\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"top-r\">\n    \u003cspan id=\"conn\" class=\"pill\" hidden>\u003c/span>\n    \u003cbutton id=\"btn-stop\" class=\"btn alt sm\" hidden>Stoppen\u003c/button>\n  \u003c/div>\n\u003c/header>\n\u003cdiv id=\"perm\" class=\"wrap\" hidden>\u003cdiv class=\"banner\">Dit apparaat mag niet meespelen via de verbinding. Vraag de eigenaar van de pagina om je als medewerker toe te voegen.\u003c/div>\u003c/div>\n\n\u003cmain>\n\u003c!-- START -->\n\u003csection id=\"v-start\" class=\"wrap\">\n  \u003cdiv class=\"hero\">\n    \u003ch1>Tekenen, raden, scoren.\u003c/h1>\n    \u003cp class=\"lead muted\">Voor 2 tot 10 spelers. Speel met \u00e9\u00e9n scherm voor iedereen, of laat iedereen op de eigen telefoon tekenen. Wie het goed raadt, tikt gewoon zijn naam aan.\u003c/p>\n    \u003cdiv>\u003cbutton id=\"btn-lang\" class=\"btn alt sm\" type=\"button\" onclick=\"try{localStorage.setItem('krab.lang','en')}catch(e){}location.hash='en';location.reload()\">English\u003c/button>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"opts\">\n    \u003cdiv class=\"card stack\">\n      \u003cdiv>\u003ch2>Hoofdscherm\u003c/h2>\u003cp class=\"muted\" style=\"margin-top:6px\">Start hier een spel op de tv, laptop of tablet. Spelers voegen hun naam toe op dit scherm of komen erbij met een telefoon.\u003c/p>\u003c/div>\n      \u003cbutton id=\"btn-new\" class=\"btn big\">Nieuw spel starten\u003c/button>\n      \u003cdiv id=\"resume-host\" hidden>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card stack\">\n      \u003cdiv>\u003ch2>Meedoen met mijn telefoon\u003c/h2>\u003cp class=\"muted\" style=\"margin-top:6px\">Vul de code van 4 letters in die op het hoofdscherm staat.\u003c/p>\u003c/div>\n      \u003clabel class=\"field\">\u003cspan>Code\u003c/span>\u003cinput id=\"in-code\" maxlength=\"4\" autocomplete=\"off\" autocapitalize=\"characters\" spellcheck=\"false\" style=\"text-transform:uppercase;letter-spacing:.2em;font-weight:800\">\u003c/label>\n      \u003clabel class=\"field\">\u003cspan>Je naam\u003c/span>\u003cinput id=\"in-name\" maxlength=\"14\" autocomplete=\"off\">\u003c/label>\n      \u003cbutton id=\"btn-join\" class=\"btn big\">Verbinden\u003c/button>\n      \u003cp id=\"join-msg\" class=\"note\" role=\"status\">\u003c/p>\n      \u003cdiv id=\"resume-phone\" hidden>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-top:16px\">\n    \u003ch3>Zo werkt het\u003c/h3>\n    \u003col class=\"steps\">\n      \u003cli>Het hoofdscherm start een spel en laat een code zien.\u003c/li>\n      \u003cli>Spelers typen hun naam op het hoofdscherm of melden zich met hun telefoon.\u003c/li>\n      \u003cli>De tekenaar krijgt een geheim woord en tekent. De anderen roepen hun gok.\u003c/li>\n      \u003cli>Wie het goed heeft, tikt zijn naam aan. Hoe sneller, hoe meer punten.\u003c/li>\n    \u003c/ol>\n    \u003cp class=\"note\" style=\"margin-top:10px\">Valt de verbinding weg, dan blijft het spel op het hoofdscherm staan. Telefoons sluiten vanzelf weer aan en de tekening wordt hersteld.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- HOST -->\n\u003csection id=\"v-host\" class=\"wrap\" hidden>\n  \u003cdiv id=\"h-lobby\" class=\"phase\">\n    \u003cdiv class=\"grid2\">\n      \u003cdiv class=\"stack\">\n        \u003cdiv class=\"card\">\n          \u003ch3>Spelers\u003c/h3>\n          \u003cdiv id=\"l-players\" class=\"names\" style=\"margin-bottom:12px\">\u003c/div>\n          \u003cdiv class=\"row\">\n            \u003cinput id=\"l-name\" class=\"grow\" maxlength=\"14\" placeholder=\"Typ een naam\" autocomplete=\"off\" aria-label=\"Naam van speler\">\n            \u003cbutton id=\"btn-add\" class=\"btn alt\">Toevoegen\u003c/button>\n          \u003c/div>\n          \u003cp class=\"note\" style=\"margin-top:10px\">Alleen dit apparaat? Voeg alle namen hier toe. Tijdens het raden tikt de tekenaar op de naam van wie het goed had.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"card stack\">\n          \u003ch3 style=\"margin:0\">Instellingen\u003c/h3>\n          \u003cdiv class=\"field\">\u003cspan>Rondes\u003c/span>\u003cdiv id=\"s-rounds\" class=\"seg\">\u003c/div>\u003c/div>\n          \u003cdiv class=\"field\">\u003cspan>Tekentijd per beurt\u003c/span>\u003cdiv id=\"s-secs\" class=\"seg\">\u003c/div>\u003c/div>\n          \u003clabel class=\"field\">\u003cspan>Woorden\u003c/span>\u003cselect id=\"s-cat\">\u003c/select>\u003c/label>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"stack\">\n        \u003cdiv class=\"card\">\n          \u003cdiv class=\"eyebrow\">Telefoons erbij?\u003c/div>\n          \u003cdiv id=\"l-code\" class=\"code\">----\u003c/div>\n          \u003cp class=\"muted\">Open dezelfde link op een telefoon, kies Meedoen met mijn telefoon en vul deze code in.\u003c/p>\n          \u003cp id=\"l-link\" class=\"note\" style=\"margin-top:8px\" role=\"status\">\u003c/p>\n        \u003c/div>\n        \u003cbutton id=\"btn-start\" class=\"btn hi big\">Spel starten\u003c/button>\n        \u003cp id=\"l-need\" class=\"note\" role=\"status\">\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv id=\"h-play\" class=\"phase\" hidden>\n    \u003cdiv class=\"play-grid\">\n      \u003cdiv>\n        \u003cdiv id=\"h-banner\" class=\"banner\" hidden>\u003c/div>\n        \u003cdiv class=\"stage\">\u003ccanvas id=\"h-canvas\" aria-label=\"Tekenvel\">\u003c/canvas>\u003cdiv id=\"h-cover\" class=\"cover\" hidden>\u003c/div>\u003c/div>\n        \u003cdiv id=\"h-tools\" class=\"tools\" hidden>\u003c/div>\n      \u003c/div>\n      \u003caside class=\"stack\">\n        \u003cdiv id=\"h-turn\" class=\"card\">\u003c/div>\n        \u003cdiv id=\"h-actions\" class=\"card stack\">\u003c/div>\n        \u003cdiv id=\"h-names\" class=\"card\" hidden>\u003c/div>\n        \u003cdiv id=\"h-score\" class=\"card\">\u003c/div>\n      \u003c/aside>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv id=\"h-end\" class=\"phase\" hidden>\n    \u003cdiv class=\"grid2\">\n      \u003cdiv class=\"card\" id=\"e-podium\">\u003c/div>\n      \u003cdiv class=\"stack\">\n        \u003cbutton id=\"btn-again\" class=\"btn big\">Nog een potje\u003c/button>\n        \u003cp class=\"note\">Dezelfde spelers, de stand begint weer bij nul.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- PHONE -->\n\u003csection id=\"v-phone\" class=\"wrap narrow\" hidden>\n  \u003cdiv class=\"stack\">\n    \u003cdiv id=\"p-wait\" class=\"card\">\u003c/div>\n    \u003cdiv id=\"p-lobby\" class=\"card\" hidden>\u003c/div>\n    \u003cdiv id=\"p-ready\" class=\"card stack\" hidden>\u003c/div>\n    \u003cdiv id=\"p-play\" class=\"stack\" hidden>\n      \u003cdiv id=\"p-top\" class=\"card\">\u003c/div>\n      \u003cdiv id=\"p-padwrap\" hidden>\n        \u003cdiv class=\"stage\">\u003ccanvas id=\"p-canvas\" aria-label=\"Tekenvel\">\u003c/canvas>\u003c/div>\n        \u003cdiv id=\"p-tools\" class=\"tools\">\u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"p-names\" class=\"card\" hidden>\u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"p-reveal\" class=\"card stack\" hidden>\u003c/div>\n    \u003cdiv id=\"p-end\" class=\"card stack\" hidden>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\u003c/main>\n\n\u003cscript>\n(function(){\n\"use strict\";\n\n/* ---------- gegevens ---------- */\nconst PAPER=\"#fbfbf8\";\nconst INK=[\"#1b1b1f\",\"#e5484d\",\"#f08a24\",\"#f5c518\",\"#30a46c\",\"#3e63dd\",\"#8e4ec6\",\"#8b5a2b\",PAPER];\nconst INKNAME=[\"zwart\",\"rood\",\"oranje\",\"geel\",\"groen\",\"blauw\",\"paars\",\"bruin\",\"gum\"];\nconst WIDTHS=[6,14,30];\nconst WORDS={\n  dieren:[\"olifant\",\"giraffe\",\"pingu\u00efn\",\"kikker\",\"vlinder\",\"spin\",\"haai\",\"kameel\",\"uil\",\"schildpad\",\"konijn\",\"ezel\",\"kreeft\",\"slak\",\"papegaai\",\"zeepaard\",\"vleermuis\",\"eekhoorn\",\"krokodil\",\"flamingo\",\"egel\",\"octopus\"],\n  eten:[\"pannenkoek\",\"stroopwafel\",\"patat\",\"pizza\",\"ijsje\",\"appel\",\"banaan\",\"broodje kaas\",\"hagelslag\",\"soep\",\"taart\",\"popcorn\",\"spaghetti\",\"citroen\",\"wortel\",\"spiegelei\",\"koekje\",\"pindakaas\",\"oliebol\",\"chocolademelk\"],\n  dingen:[\"paraplu\",\"fiets\",\"bril\",\"sleutel\",\"lamp\",\"gitaar\",\"televisie\",\"schaar\",\"kaars\",\"wekker\",\"ladder\",\"rugzak\",\"telefoon\",\"bed\",\"kroon\",\"tandenborstel\",\"ballon\",\"kompas\",\"hangmat\",\"trampoline\"],\n  acties:[\"zwemmen\",\"slapen\",\"dansen\",\"vissen\",\"koken\",\"schaatsen\",\"niezen\",\"klimmen\",\"be \n.pill{font-size:13px;font-weight:700;padding:6px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);display:inline-flex;gap:7px;align-items:center}\n.pill.ok::before,.pill.bad::before{content:\"\";width:8px;height:8px;border-radius:50%;background:var(--good)}\n.pill.bad::before{background:var(--bad)}\nbutton{font:inherit;color:inherit;cursor:pointer}\n.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink);min-height:48px}\n.btn:active{transform:translateY(1px)}\n.btn.alt{background:var(--panel);color:var(--ink);border:2px solid var(--line)}\n.btn.hi{background:var(--hi);color:var(--hi-ink)}\n.btn.bad{background:var(--panel);color:var(--bad);border:2px solid var(--line)}\n.btn.sm{padding:7px 12px;font-size:14px;min-height:38px;border-radius:10px}\n.btn.big{font-size:20px;padding:17px 26px;width:100%}\n.btn[disabled]{opacity:.45;cursor:not-allowed}\n:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\ninput,select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:11px 14px;min-height:48px;width:100%}\n.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}\n.stack{display:flex;flex-direction:column;gap:14px}\n.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}\n.row>*{min-width:0}\n.grow{flex:1 1 140px}\n.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}\n.play-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}\n@media (max-width:860px){.grid2,.play-grid{grid-template-columns:minmax(0,1fr)}}\n.hero{padding-block:10px 22px;display:flex;flex-direction:column;gap:14px;max-width:760px}\n.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}\n.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}\n.names{display:flex;flex-wrap:wrap;gap:8px}\n.name{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:2px solid var(--line);background:var(--panel);font-weight:700;font-size:17px;max-width:100%}\n.name .dot{width:14px;height:14px;border-radius:50%;flex:none}\n.name small{font-weight:600;font-size:12px;color:var(--muted)}\n.name.off{opacity:.65}\nbutton.name:hover{border-color:var(--accent)}\n.name.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}\n.name .x{border:0;background:none;font-size:20px;line-height:1;padding:0 0 0 2px;color:var(--muted)}\n.code{font:800 clamp(46px,9vw,78px)/1 var(--font-display);letter-spacing:.14em;margin-block:6px}\n.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:12px;overflow:hidden}\n.seg button{border:0;background:var(--panel);padding:9px 14px;font-weight:700;min-height:42px}\n.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}\n.field{display:flex;flex-direction:column;gap:6px}\n.field>span{font-size:13px;font-weight:700;color:var(--muted)}\n.stage{position:relative;width:100%;aspect-ratio:10/7;background:var(--paper);border-radius:18px;border:2px solid var(--line);overflow:hidden;touch-action:none}\n.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}\n.cover{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:22px;background:rgba(251,251,248,.94);color:var(--paper-ink)}\n.cover .eyebrow{color:#5c6075}\n.huge{font-size:clamp(28px,5vw,46px)}\n.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}\n.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line);padding:0;font-size:11px;font-weight:800}\n.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--accent)}\n.sw.eraser{background:var(--paper);color:var(--paper-ink)}\n.wd{width:40px;height:40px;border-radius:50%;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;padding:0}\n.wd i{display:block;border-radius:50%;background:var(--ink)}\n.wd[aria-pressed=true]{border-color:var(--accent)}\n.timer{font:800 56px/1 var(--font-display);font-variant-numeric:tabular-nums;margin-top:6px}\n.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}\n.bar>i{display:block;height:100%;width:100%;background:var(--hi);transition:width .25s linear}\n.bar.low>i{background:var(--bad)}\n.bigword{font:800 clamp(30px,5vw,44px)/1.05 var(--font-display);overflow-wrap:anywhere}\n.secret{font:800 26px/1.1 var(--font-display);padding:12px 14px;border-radius:12px;border:2px dashed var(--line);color:var(--muted);overflow-wrap:anywhere}\n.secret.on{color:var(--ink);border-style:solid;border-color:var(--accent)}\n.peek{display:flex;flex-direction:column;gap:8px}\n.banner{padding:12px 14px;border-radius:12px;background:var(--hi);color:var(--hi-ink);font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:10px}\n.confirm{display:flex;flex-direction:column;gap:8px;margin-top:12px}\n.rank{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:8px}\n.rank li{padding-left:4px}\n.rank li>div{display:flex;align-items:center;gap:8px}\n.rank .nm{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}\n.rank .pts{font-variant-numeric:tabular-nums}\n.rank .dot{width:12px;height:12px;border-radius:50%;flex:none}\n.phase{display:block}\n.note{font-size:14px;color:var(--muted)}\n@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\n\u003cheader class=\"top\">\n  \u003cdiv class=\"brand\">\n    \u003csvg viewBox=\"0 0 40 40\" aria-hidden=\"true\">\u003cpath class=\"sq\" d=\"M5 30 C 10 8, 14 38, 20 18 S 30 6, 35 24\"/>\u003c/svg>\n    \u003cspan>Scribble Race\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"top-r\">\n    \u003cspan id=\"conn\" class=\"pill\" hidden>\u003c/span>\n    \u003cbutton id=\"btn-stop\" class=\"btn alt sm\" hidden>Stop\u003c/button>\n  \u003c/div>\n\u003c/header>\n\u003cdiv id=\"perm\" class=\"wrap\" hidden>\u003cdiv class=\"banner\">This device is not allowed to join through the connection. Ask the page owner to add you as a collaborator.\u003c/div>\u003c/div>\n\n\u003cmain>\n\u003c!-- START -->\n\u003csection id=\"v-start\" class=\"wrap\">\n  \u003cdiv class=\"hero\">\n    \u003ch1>Draw, guess, score.\u003c/h1>\n    \u003cp class=\"lead muted\">For 2 to 10 players. Play on one screen for everyone, or let everyone draw on their own phone. Whoever guesses right simply taps their name.\u003c/p>\n    \u003cdiv>\u003cbutton id=\"btn-lang\" class=\"btn alt sm\" type=\"button\" onclick=\"try{localStorage.setItem('krab.lang','nl')}catch(e){}location.hash='nl';location.reload()\">Nederlands\u003c/button>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"opts\">\n    \u003cdiv class=\"card stack\">\n      \u003cdiv>\u003ch2>Main screen\u003c/h2>\u003cp class=\"muted\" style=\"margin-top:6px\">Start a game here on a TV, laptop or tablet. Players add their name on this screen or join with a phone.\u003c/p>\u003c/div>\n      \u003cbutton id=\"btn-new\" class=\"btn big\">Start a new game\u003c/button>\n      \u003cdiv id=\"resume-host\" hidden>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card stack\">\n      \u003cdiv>\u003ch2>Join with my phone\u003c/h2>\u003cp class=\"muted\" style=\"margin-top:6px\">Enter the 4-letter code shown on the main screen.\u003c/p>\u003c/div>\n      \u003clabel class=\"field\">\u003cspan>Code\u003c/span>\u003cinput id=\"in-code\" maxlength=\"4\" autocomplete=\"off\" autocapitalize=\"characters\" spellcheck=\"false\" style=\"text-transform:uppercase;letter-spacing:.2em;font-weight:800\">\u003c/label>\n      \u003clabel class=\"field\">\u003cspan>Your name\u003c/span>\u003cinput id=\"in-name\" maxlength=\"14\" autocomplete=\"off\">\u003c/label>\n      \u003cbutton id=\"btn-join\" class=\"btn big\">Connect\u003c/button>\n      \u003cp id=\"join-msg\" class=\"note\" role=\"status\">\u003c/p>\n      \u003cdiv id=\"resume-phone\" hidden>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-top:16px\">\n    \u003ch3>How it works\u003c/h3>\n    \u003col class=\"steps\">\n      \u003cli>The main screen starts a game and shows a code.\u003c/li>\n      \u003cli>Players type their name on the main screen or join with their phone.\u003c/li>\n      \u003cli>The drawer gets a secret word and draws. The others shout their guesses.\u003c/li>\n      \u003cli>Whoever gets it right taps their name. The faster, the more points.\u003c/li>\n    \u003c/ol>\n    \u003cp class=\"note\" style=\"margin-top:10px\">If the connection drops, the game stays on the main screen. Phones reconnect by themselves and the drawing is restored.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- HOST -->\n\u003csection id=\"v-host\" class=\"wrap\" hidden>\n  \u003cdiv id=\"h-lobby\" class=\"phase\">\n    \u003cdiv class=\"grid2\">\n      \u003cdiv class=\"stack\">\n        \u003cdiv class=\"card\">\n          \u003ch3>Players\u003c/h3>\n          \u003cdiv id=\"l-players\" class=\"names\" style=\"margin-bottom:12px\">\u003c/div>\n          \u003cdiv class=\"row\">\n            \u003cinput id=\"l-name\" class=\"grow\" maxlength=\"14\" placeholder=\"Type a name\" autocomplete=\"off\" aria-label=\"Player name\">\n            \u003cbutton id=\"btn-add\" class=\"btn alt\">Add\u003c/button>\n          \u003c/div>\n          \u003cp class=\"note\" style=\"margin-top:10px\">Only this device? Add all names here. While guessing, the drawer taps the name of whoever got it right.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"card stack\">\n          \u003ch3 style=\"margin:0\">Settings\u003c/h3>\n          \u003cdiv class=\"field\">\u003cspan>Rounds\u003c/span>\u003cdiv id=\"s-rounds\" class=\"seg\">\u003c/div>\u003c/div>\n          \u003cdiv class=\"field\">\u003cspan>Drawing time per turn\u003c/span>\u003cdiv id=\"s-secs\" class=\"seg\">\u003c/div>\u003c/div>\n          \u003clabel class=\"field\">\u003cspan>Words\u003c/span>\u003cselect id=\"s-cat\">\u003c/select>\u003c/label>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"stack\">\n        \u003cdiv class=\"card\">\n          \u003cdiv class=\"eyebrow\">Add phones?\u003c/div>\n          \u003cdiv id=\"l-code\" class=\"code\">----\u003c/div>\n          \u003cp class=\"muted\">Open the same link on a phone, choose Join with my phone and enter this code.\u003c/p>\n          \u003cp id=\"l-link\" class=\"note\" style=\"margin-top:8px\" role=\"status\">\u003c/p>\n        \u003c/div>\n        \u003cbutton id=\"btn-start\" class=\"btn hi big\">Start game\u003c/button>\n        \u003cp id=\"l-need\" class=\"note\" role=\"status\">\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv id=\"h-play\" class=\"phase\" hidden>\n    \u003cdiv class=\"play-grid\">\n      \u003cdiv>\n        \u003cdiv id=\"h-banner\" class=\"banner\" hidden>\u003c/div>\n        \u003cdiv class=\"stage\">\u003ccanvas id=\"h-canvas\" aria-label=\"Drawing pad\">\u003c/canvas>\u003cdiv id=\"h-cover\" class=\"cover\" hidden>\u003c/div>\u003c/div>\n        \u003cdiv id=\"h-tools\" class=\"tools\" hidden>\u003c/div>\n      \u003c/div>\n      \u003caside class=\"stack\">\n        \u003cdiv id=\"h-turn\" class=\"card\">\u003c/div>\n        \u003cdiv id=\"h-actions\" class=\"card stack\">\u003c/div>\n        \u003cdiv id=\"h-names\" class=\"card\" hidden>\u003c/div>\n        \u003cdiv id=\"h-score\" class=\"card\">\u003c/div>\n      \u003c/aside>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv id=\"h-end\" class=\"phase\" hidden>\n    \u003cdiv class=\"grid2\">\n      \u003cdiv class=\"card\" id=\"e-podium\">\u003c/div>\n      \u003cdiv class=\"stack\">\n        \u003cbutton id=\"btn-again\" class=\"btn big\">Play again\u003c/button>\n        \u003cp class=\"note\">Same players, the scores start at zero again.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- PHONE -->\n\u003csection id=\"v-phone\" class=\"wrap narrow\" hidden>\n  \u003cdiv class=\"stack\">\n    \u003cdiv id=\"p-wait\" class=\"card\">\u003c/div>\n    \u003cdiv id=\"p-lobby\" class=\"card\" hidden>\u003c/div>\n    \u003cdiv id=\"p-ready\" class=\"card stack\" hidden>\u003c/div>\n    \u003cdiv id=\"p-play\" class=\"stack\" hidden>\n      \u003cdiv id=\"p-top\" class=\"card\">\u003c/div>\n      \u003cdiv id=\"p-padwrap\" hidden>\n        \u003cdiv class=\"stage\">\u003ccanvas id=\"p-canvas\" aria-label=\"Drawing pad\">\u003c/canvas>\u003c/div>\n        \u003cdiv id=\"p-tools\" class=\"tools\">\u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"p-names\" class=\"card\" hidden>\u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"p-reveal\" class=\"card stack\" hidden>\u003c/div>\n    \u003cdiv id=\"p-end\" class=\"card stack\" hidden>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\u003c/main>\n\n\u003cscript>\n(function(){\n\"use strict\";\n\n/* ---------- gegevens ---------- */\nconst PAPER=\"#fbfbf8\";\nconst INK=[\"#1b1b1f\",\"#e5484d\",\"#f08a24\",\"#f5c518\",\"#30a46c\",\"#3e63dd\",\"#8e4ec6\",\"#8b5a2b\",PAPER];\nconst INKNAME=[\"black\",\"red\",\"orange\",\"yellow\",\"green\",\"blue\",\"purple\",\"brown\",\"eraser\"];\nconst WIDTHS=[6,14,30];\nconst WORDS={\n  dieren:[\"elephant\",\"giraffe\",\"penguin\",\"frog\",\"butterfly\",\"spider\",\"shark\",\"camel\",\"owl\",\"turtle\",\"rabbit\",\"donkey\",\"lobster\",\"snail\",\"parrot\",\"seahorse\",\"bat\",\"squirrel\",\"crocodile\",\"flamingo\",\"hedgehog\",\"octopus\"],\n  eten:[\"pancake\",\"stroopwafel\",\"french fries\",\"pizza\",\"ice cream\",\"apple\",\"banana\",\"cheese sandwich\",\"sprinkles\",\"soup\",\"cake\",\"popcorn\",\"spaghetti\",\"lemon\",\"carrot\",\"fried egg\",\"cookie\",\"peanut butter\",\"doughnut\",\"hot chocolate\"],\n  dingen:[\"umbrella\",\"bicycle\",\"glasses\",\"key\",\"lamp\",\"guitar\",\"television\",\"scissors\",\"candle\",\"alarm clock\",\"ladder\",\"backpack\",\"telephone\",\"bed\",\"crown\",\"toothbrush\",\"balloon\",\"compass\",\"hammock\",\"trampoline\"],\n  acties:[\"swimming\",\"sleeping\",\"dancing\",\"fishing\",\"cooking\",\"ice skating\",\"sneezing\",\"climbing\",\"calling\",\"laughing\",\"jumping\",\"painting\",\"washing dishes\",\"flying\",\"singing\",\"diving\",\"running\",\"playing soccer\",\"brushing teeth\",\"taking a photo\"],\n  plekken:[\"beach\",\"forest\",\"bridge\",\"school\",\"hospital\",\"cinema\",\"volcano\",\"island\",\"desert\",\"church\",\"train station\",\"supermarket\",\"farm\",\"space station\",\"lighthouse\",\"tent\",\"harbor\",\"stadium\",\"library\",\"castle\"],\n  nl:[\"windmill\",\"tulip\",\"wooden clogs\",\"dike\",\"Sinterklaas\",\"canal\",\"kale stew\",\"fun fair\",\"croquette\",\"polder\",\"ice rink\",\"aniseed candy\",\"licorice\",\"rain shower\",\"bicycle shed\",\"cheese market\",\"flower market\",\"grilled sandwich\",\"barge\",\"dairy cow\"]\n};\nconst CATLABEL={alles:\"Everything mixed\",dieren:\"Animals\",eten:\"Food and drink\",dingen:\"Things\",acties:\"Actions\",plekken:\"Places\",nl:\"The Netherlands\"};\nconst LS_HOST=\"krab.host.v1\", LS_PH=\"krab.phone.v1\";\n\n/* ---------- hulpjes ---------- */\nconst $=(s,r)=>(r||document).querySelector(s);\nfunction h(tag,attrs,...kids){\n  const e=document.createElement(tag);\n  if(attrs) for(const k in attrs){\n    const v=attrs[k]; if(v==null||v===false) continue;\n    if(k===\"class\") e.className=v;\n    else if(k.startsWith(\"on\")) e.addEventListener(k.slice(2),v);\n    else if(v===true) e.setAttribute(k,\"\"); else e.setAttribute(k,v);\n  }\n  for(const c of kids.flat(Infinity)){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }\n  return e;\n}\nfunction fill(e,...kids) n}\nfunction makeRoom(role,code){\n  return new Promise((resolve,reject)=>{\n    const hostId=\"krab-\"+code.toLowerCase();\n    const evH={}, connH=[], peerH=[], remote=new Map();\n    let me={}, hostPres={}, up=false, dead=false, opened=false, tries=0, peer=null, hostConn=null, wd=0;\n    const base={isMe:false,sameTab:false,kind:\"viewer\",guest:false,by:null};\n    const fire=(topic,m)=>{ (evH[topic]||[]).slice().forEach(f=>{try{f(m)}catch(e){console.error(e)}}); };\n    const notifyPeers=()=>{ const c={peers:api.peers()}; peerH.slice().forEach(f=>{try{f(c)}catch(e){console.error(e)}}); };\n    const setUp=v=>{ if(up===v) return; up=v; connH.slice().forEach(f=>{try{f(up)}catch(e){}}); };\n    const sendAll=m=>{\n      try{\n        if(role===\"host\") remote.forEach(r=>{ if(r.conn.open) r.conn.send(m); });\n        else if(hostConn&&hostConn.open) hostConn.send(m);\n      }catch(e){}\n    };\n    const handle=(from,msg)=>{\n      if(!msg||typeof msg!==\"object\") return;\n      if(msg.k===\"ev\"&&typeof msg.t===\"string\") fire(msg.t,Object.assign({topic:msg.t,data:msg.d,peer:from},base));\n      else if(msg.k===\"pr\"&&msg.d&&typeof msg.d===\"object\"){\n        if(role===\"host\"){ const r=remote.get(from); if(r){ r.presence=msg.d; r.updatedAt=Date.now(); notifyPeers(); } }\n        else { hostPres=msg.d; notifyPeers(); }\n      }\n    };\n    const api={\n      emit(topic,data){ sendAll({k:\"ev\",t:topic,d:data}); return Promise.resolve(); },\n      on(topic,fn){ (evH[topic]=evH[topic]||[]).push(fn); return ()=>{ evH[topic]=(evH[topic]||[]).filter(f=>f!==fn); }; },\n      presence(patch){ for(const k in patch){ if(patch[k]===null) delete me[k]; else me[k]=patch[k]; } sendAll({k:\"pr\",d:me}); return Promise.resolve(); },\n      peers(){\n        const list=[Object.assign({peer:\"me\",presence:me,updatedAt:0},base,{isMe:true,sameTab:true})];\n        if(role===\"host\") remote.forEach((r,id)=>list.push(Object.assign({peer:id,presence:r.presence,updatedAt:r.upd
